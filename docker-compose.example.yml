services:
  vidra:
    image: ghcr.io/azmekk/vidra:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    # Only for trying Vidra over plain HTTP on your LAN. Keep it off behind HTTPS.
    # environment:
    #   VIDRA_INSECURE_COOKIES: "true"
